
services:
  mysql:
    image: mysql:8.0
    container_name: servidor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: prueba01_mysql
      MYSQL_USER: alumno
      MYSQL_PASSWORD: "123456"
    ports:
      - "3306:3306"
    volumes:
      - mysql_datos:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: servidor-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_datos:
