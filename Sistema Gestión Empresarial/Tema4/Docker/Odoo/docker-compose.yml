services:
  odoo:
    image: odoo:19.0
    container_name:  odoo
    env_file: .env
    depends_on:
      - postgres
    ports:
      - "8069:8069"
    volumes:
      - data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons

  postgres:
    image: postgres:13
    container_name:  postgres-odoo
    env_file: .env
    volumes:
      - db:/var/lib/postgresql/data/pgdata

  pgadmin:
    container_name: pgadmin_odoo
    image: dpage/pgadmin4
    restart: always
    env_file: .env
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  data:
  db:
  pgadmin-data:
